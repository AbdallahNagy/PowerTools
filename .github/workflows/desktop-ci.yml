name: Desktop CI

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "api/**"
      - "CHANGELOG.md"
      - "scripts/changelog*.mjs"
      - "README.md"
      - "scripts/sync-readme-tools.*"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "api/**"
      - "CHANGELOG.md"
      - "scripts/changelog*.mjs"
      - "README.md"
      - "scripts/sync-readme-tools.*"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Check changelog
        run: |
          node --test ../scripts/changelog.test.mjs
          node ../scripts/changelog.mjs check

      - name: Install dependencies
        run: npm ci

      # The smoke test starts the sidecar with `dotnet run`. On a cold runner
      # that compiles the API first, which can outlast the sidecar's 30 s
      # ready timeout and leave the app stuck on its startup error dialog.
      # Building here makes the smoke test's `dotnet run` an up-to-date check.
      - name: Build sidecar
        run: dotnet build ../api/PowerTools/PowerTools.API/PowerTools.API.csproj

      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox
      # needs, so the smoke test's Electron would exit at launch.
      - name: Allow the Electron sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run desktop checks
        if: runner.os != 'Linux'
        run: npm run check

      # Linux runners have no display, so the smoke test runs in a virtual one.
      - name: Run desktop checks
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: desktop/playwright-report
          if-no-files-found: ignore
          retention-days: 7
