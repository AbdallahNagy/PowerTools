name: Release Desktop

# Builds the Windows installer and publishes it as a GitHub release for the
# version in desktop/package.json. The release body is that version's section
# of CHANGELOG.md, which the in-app update dialog shows. See docs/releasing.md.
#
# It runs when a version bump lands on main (usually by merging the pull
# request from Prepare Release), and can also be run by hand.
on:
  push:
    branches:
      - main
    paths:
      - desktop/package.json
  workflow_dispatch:
    inputs:
      notes_only:
        description: Only update the release notes of an existing release
        type: boolean
        default: false
      draft:
        description: Publish as a draft release (hidden from users and the auto-updater)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  # A push to desktop/package.json publishes only when its version has no
  # release yet, so dependency updates do not start a release.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released. Nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing v$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Read version and release notes
        id: meta
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          node ../scripts/changelog.mjs extract $version --out $notes
          if ($LASTEXITCODE -ne 0) { throw "Missing release notes: add a [$version] section to CHANGELOG.md" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        if: ${{ !inputs.notes_only }}
        run: npm ci

      - name: Build and publish
        if: ${{ !inputs.notes_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uploads renderer source maps to Sentry. See desktop/vite.config.ts.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Overrides releaseType in electron-builder.json. electron-builder
          # treats an empty EP_DRAFT as true, and inputs.draft is empty on
          # push, so compare to get an explicit "true" or "false".
          EP_DRAFT: ${{ inputs.draft == true }}
        run: |
          npm run publish:api:win
          npm run transpile:electron
          npm run build
          npx electron-builder --win --x64 --publish always

      # electron-builder does not reliably set the release body, so set it here.
      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.meta.outputs.version }}" --notes-file "${{ steps.meta.outputs.notes }}"
