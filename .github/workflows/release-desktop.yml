name: Release Desktop

# Builds the Windows installer and publishes it as a GitHub release for the
# version in desktop/package.json. The release body comes from
# desktop/docs/releases/v<version>.md, which the in-app update dialog shows.
on:
  workflow_dispatch:
    inputs:
      notes_only:
        description: Only update the release notes of an existing release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Read version and release notes
        id: meta
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = Join-Path $PWD "docs/releases/v$version.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: docs/releases/v$version.md" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        if: ${{ !inputs.notes_only }}
        run: npm ci

      - name: Build and publish
        if: ${{ !inputs.notes_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run publish:api:win
          npm run transpile:electron
          npm run build
          npx electron-builder --win --x64 --publish always

      # electron-builder does not reliably set the release body, so set it here.
      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.meta.outputs.version }}" --notes-file "${{ steps.meta.outputs.notes }}"
