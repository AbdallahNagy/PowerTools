name: Release Desktop

# Builds the Windows, macOS, and Linux installers and publishes them as one
# GitHub release for the version in desktop/package.json. The release body is
# that version's section of CHANGELOG.md, which the in-app update dialog shows.
# See docs/releasing.md.
#
# It runs when a version bump lands on main (usually by merging the pull
# request from Prepare Release), and can also be run by hand.
on:
  push:
    branches:
      - main
    paths:
      - desktop/package.json
  workflow_dispatch:
    inputs:
      notes_only:
        description: Only update the release notes of an existing release
        type: boolean
        default: false
      draft:
        description: Publish as a draft release (hidden from users and the auto-updater)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  # A push to desktop/package.json publishes only when its version has no
  # release yet, so dependency updates do not start a release.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released. Nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing v$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Each platform builds on its own runner: the .NET sidecar and the installers
  # are native to it. Nothing is published until all three succeed.
  build:
    needs: decide
    if: needs.decide.outputs.publish == 'true' && !inputs.notes_only
    name: build (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: win
            os: windows-latest
          - platform: mac
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        env:
          # Uploads renderer source maps to Sentry. See desktop/vite.config.ts.
          # The renderer is the same on every platform, so only one build uploads.
          SENTRY_AUTH_TOKEN: ${{ matrix.platform == 'win' && secrets.SENTRY_AUTH_TOKEN || '' }}
          # macOS signing and notarization. Without these secrets the app is
          # built unsigned: it runs after the user allows it in System Settings,
          # but macOS cannot install its updates automatically.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run dist:${{ matrix.platform }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          # Installers, their blockmaps, and the latest*.yml update feeds.
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [decide, build]
    # Runs after a successful build, or alone to update the notes only.
    if: always() && needs.decide.outputs.publish == 'true' && (needs.build.result == 'success' || (inputs.notes_only && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version and release notes
        id: meta
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          notes="$RUNNER_TEMP/release-notes.md"
          if ! node scripts/changelog.mjs extract "$version" --out "$notes"; then
            echo "::error::Missing release notes: add a [$version] section to CHANGELOG.md"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Download installers
        if: ${{ !inputs.notes_only }}
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Publish release
        if: ${{ !inputs.notes_only }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
          # Hidden from users and the auto-updater until it is published by hand.
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        run: |
          ls -la installers
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
          else
            gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$NOTES" $DRAFT
          fi

      - name: Set release notes
        run: gh release edit "v${{ steps.meta.outputs.version }}" --notes-file "${{ steps.meta.outputs.notes }}"
